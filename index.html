<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5A7608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Treeni">
<title>Treeni</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<!-- Avausefekti: näkyy heti latauksessa, app.js poistaa sen animaation jälkeen -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="sp-logo"><span>T</span><span>R</span><span>E</span><span>E</span><span>N</span><span>I</span><i>.</i></div>
  <div class="sp-line"></div>
</div>
<header class="top">
  <h1 class="brand">TREENI<span>.</span></h1>
  <div class="top-r">
    <button class="pill" id="timerPill" hidden aria-live="polite"></button>
    <button class="avatar" id="profileBtn" aria-label="Valikko: profiili, päiväkirja ja asetukset"></button>
  </div>
</header>

<main>
  <!-- KOTI -->
  <section class="view" id="view-home">
    <div id="home"></div>
  </section>

  <!-- LIIKKEET (liikekirjasto) -->
  <section class="view" id="view-muscles" hidden>
    <div class="map-head">
      <h2>Liikkeet</h2>
      <button class="map-tg" id="mapToggle" aria-expanded="false" aria-controls="mapBox">Näytä lihaskartta</button>
    </div>
    <div class="filters">
      <input id="search" type="search" placeholder="Hae liikettä…" autocomplete="off" aria-label="Hae liikettä">
      <select id="equip" aria-label="Väline"><option value="">Kaikki välineet</option></select>
    </div>
    <div class="mgroups" id="mgroups" role="group" aria-label="Lihasryhmät"></div>
    <div class="chips" id="selChips"></div>
    <div class="mapbox" id="mapBox" hidden>
      <div class="map-sub"><span>Napauta lihasta kartalta</span>
        <div class="seg" id="sexSeg" role="group" aria-label="Kehon malli"><button data-sex="male">Mies</button><button data-sex="female">Nainen</button></div></div>
      <div class="map-wrap" id="map"></div>
    </div>
    <p class="count" id="count"></p>
    <div class="grid" id="list"></div>
    <button class="more" id="more" hidden>Näytä lisää</button>
  </section>

  <!-- TREENI -->
  <section class="view" id="view-workout" hidden>
    <div id="workout"></div>
  </section>

  <!-- HISTORIA -->
  <section class="view" id="view-history" hidden>
    <div id="history"></div>
  </section>
</main>

<!-- Käynnissä olevan treenin pikapalkki: näkyy alapalkin yllä, kun treeni on kesken -->
<button class="resume" id="resumeBar" hidden><i aria-hidden="true"></i><b>Treeni käynnissä</b><span></span><em>Jatka</em></button>

<nav class="tabs" aria-label="Päävalikko">
  <button class="on" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>Koti</button>
  <button data-view="muscles"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>Liikkeet</button>
  <button data-view="history"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 5-6"/></svg>Edistyminen</button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <article class="sheet-card" id="sheetCard"></article>
</div>

<div class="onboard" id="onboard" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="muscles.js"></script>
<script src="programs.js"></script>
<script src="names-fi.js"></script>
<script src="ohjeet-fi.js"></script>
<script src="mannequin.js"></script>
<script src="app.js"></script>
</body>
</html>
